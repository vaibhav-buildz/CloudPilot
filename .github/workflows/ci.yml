name: CloudPilot CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run standard library unittest test suite
        run: |
          python -m unittest discover -s tests -v

      - name: Run pytest test suite
        run: |
          python -m pytest -v

      - name: Run backend control-plane CLI smoke test
        run: |
          python -m backend.smoke_test

      - name: Verify Docker build
        run: |
          docker build -t cloudpilot-test .

      - name: Verify Docker container runtime startup
        run: |
          docker run -d --name cp -p 8000:8000 cloudpilot-test
          READY=0
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/v1/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "Backend healthy after ${i}s (HTTP 200)"
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Backend failed healthcheck within 30s. Container logs:"
            docker logs cp
            docker stop cp 2>/dev/null || true
            docker rm cp 2>/dev/null || true
            exit 1
          fi
          docker stop cp
          docker rm cp

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
